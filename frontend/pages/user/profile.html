<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hồ sơ cá nhân - Người thuê</title>
    <link rel="stylesheet" href="../../assets/css/style.css" />
    <link rel="stylesheet" href="../../assets/css/responsive.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      .profile-layout {
        display: grid;
        grid-template-columns: 1fr 2fr;
        gap: 2rem;
        align-items: start;
      }
      .avatar-wrapper {
        position: relative;
        width: 150px;
        height: 150px;
        margin: 0 auto 1.5rem;
        border-radius: 50%;
        overflow: hidden;
        border: 4px solid var(--surface-2);
        box-shadow: var(--shadow-md);
        background: var(--surface-2);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .avatar-wrapper img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .avatar-initials {
        font-size: 3rem;
        font-weight: bold;
        color: var(--text-muted);
      }
      .avatar-overlay {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        background: rgba(0, 0, 0, 0.6);
        color: white;
        height: 35%;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        opacity: 0;
        transition: opacity 0.3s;
      }
      .avatar-wrapper:hover .avatar-overlay {
        opacity: 1;
      }
      #avatarInput {
        display: none;
      }
      @media (max-width: 768px) {
        .profile-layout {
          grid-template-columns: 1fr;
        }
      }
      .input-wrapper {
        position: relative;
        display: flex;
        align-items: center;
      }
      .input-icon {
        position: absolute;
        left: 1rem;
        color: var(--text-muted);
      }
      .form-input.with-icon {
        padding-left: 2.5rem;
        border-radius: 8px;
        transition: all 0.3s;
      }
      .form-input.with-icon:focus {
        box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
      }
      .status-card {
        margin-top: 1.5rem;
        padding: 1.2rem;
        background: var(--surface-2);
        border-radius: 12px;
        border: 1px solid var(--border);
      }
      .status-row {
        display: flex;
        justify-content: space-between;
        margin-bottom: 0.8rem;
        font-size: 0.95rem;
      }
      .status-row:last-child {
        margin-bottom: 0;
      }
    </style>
  </head>

  <body>
    <div class="app-container">
      <aside class="sidebar">
        <div class="sidebar-header">
          <div class="logo-icon"><i class="fas fa-house-chimney"></i></div>
          RoomRental
        </div>
        <nav class="sidebar-nav">
          <a href="../../index.html" class="nav-item"
            ><i class="fas fa-globe"></i> Trang chủ</a
          >
          <a href="dashboard.html" class="nav-item"
            ><i class="fas fa-home"></i> Tổng quan</a
          >
          <a href="requests.html" class="nav-item"
            ><i class="fas fa-paper-plane"></i> Yêu cầu thuê</a
          >
          <a href="contracts.html" class="nav-item"
            ><i class="fas fa-file-contract"></i> Hợp đồng</a
          >
          <a href="payments.html" class="nav-item"
            ><i class="fas fa-wallet"></i> Thanh toán</a
          >
          <div class="nav-section-label">Roommate</div>
          <a href="roommate-profile.html" class="nav-item"
            ><i class="fas fa-id-card"></i> Hồ sơ ghép & Lời mời</a
          >
          <div class="nav-section-label">Khác</div>
          <a href="profile.html" class="nav-item active"
            ><i class="fas fa-user-edit"></i> Hồ sơ cá nhân</a
          >
          <a href="notifications.html" class="nav-item"
            ><i class="fas fa-bell"></i> Thông báo</a
          >
          <a href="support.html" class="nav-item"
            ><i class="fas fa-headset"></i> Hỗ trợ</a
          >
        </nav>
        <div class="sidebar-footer">
          <a href="#" id="logoutBtn" class="nav-item"
            ><i class="fas fa-sign-out-alt"></i> Đăng xuất</a
          >
        </div>
      </aside>
      <main class="main-content">
        <header class="topbar">
          <div class="topbar-left">
            <button id="mobileMenuBtn" class="mobile-menu-btn">
              <i class="fas fa-bars"></i>
            </button>
            <h2 class="page-title">Hồ sơ cá nhân</h2>
          </div>
          <div class="topbar-right">
            <a href="notifications.html" class="topbar-icon-btn"
              ><i class="fas fa-bell"></i
              ><span
                class="badge-dot"
                id="notifDot"
                style="display: none"
              ></span
            ></a>
            <div id="userDisplay"></div>
          </div>
        </header>
        <div class="page-content">
          <div class="profile-layout">
            <!-- Avatar Section -->
            <div class="card" style="text-align: center;">
              <div class="card-body">
                <div class="avatar-wrapper" id="avatarWrapper">
                  <div id="avatarDisplay" style="width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;">
                    <!-- Filled by JS -->
                  </div>
                  <label for="avatarInput" class="avatar-overlay">
                    <i class="fas fa-camera" style="font-size: 1.2rem;"></i>
                  </label>
                  <input type="file" id="avatarInput" accept="image/jpeg, image/png, image/webp" />
                </div>
                <h3 id="displayName" style="margin-bottom: 0.25rem;">—</h3>
                <p id="displayRole" class="text-muted" style="margin-bottom: 1.5rem;">Người thuê</p>
                <div style="font-size: 0.9rem; color: var(--text-muted); text-align: left; background: var(--surface-2); padding: 1rem; border-radius: 8px;">
                  <ul style="list-style: none; padding: 0; margin: 0; line-height: 1.8;">
                    <li><i class="fas fa-envelope text-muted" style="width: 20px;"></i> <span id="displayEmail">—</span></li>
                    <li><i class="fas fa-phone text-muted" style="width: 20px;"></i> <span id="displayPhone">—</span></li>
                  </ul>
                </div>
                
                <div class="status-card">
                  <h4 style="font-size: 1rem; margin-bottom: 1rem; color: var(--text-main); text-align: left;">Tình trạng tài khoản</h4>
                  <div class="status-row">
                    <span class="text-muted">Ngày tham gia:</span>
                    <span id="displayJoinDate" style="font-weight: 500;">—</span>
                  </div>
                  <div class="status-row">
                    <span class="text-muted">Trạng thái:</span>
                    <span id="displayStatus" class="badge badge-success">Đang hoạt động</span>
                  </div>
                </div>

              </div>
            </div>

            <!-- Form Section -->
            <div class="space-y-4">
              <!-- Cập nhật thông tin -->
              <div class="card">
                <div class="card-header">
                  <div class="card-title">Cập nhật thông tin</div>
                </div>
                <div class="card-body">
                  <form id="profileForm" class="space-y-4">
                    <div class="form-group">
                      <label class="form-label">Email</label>
                      <div class="input-wrapper">
                        <i class="fas fa-envelope input-icon"></i>
                        <input
                          type="email"
                          class="form-input with-icon"
                          id="profileEmail"
                          disabled
                        />
                      </div>
                    </div>
                    <div class="form-group">
                      <label class="form-label"
                        >Họ và tên <span class="text-danger">*</span></label
                      >
                      <div class="input-wrapper">
                        <i class="fas fa-user input-icon"></i>
                        <input
                          type="text"
                          class="form-input with-icon"
                          id="profileName"
                          required
                        />
                      </div>
                    </div>
                    <div class="form-group">
                      <label class="form-label">Số điện thoại</label>
                      <div class="input-wrapper">
                        <i class="fas fa-phone input-icon"></i>
                        <input type="tel" class="form-input with-icon" id="profilePhone" />
                      </div>
                    </div>
                    <button
                      type="submit"
                      class="btn btn-primary"
                      id="btnUpdateProfile"
                    >
                      <i class="fas fa-save"></i> Lưu thay đổi
                    </button>
                  </form>
                </div>
              </div>

              <!-- Đổi mật khẩu -->
              <div class="card">
                <div class="card-header">
                  <div class="card-title">Đổi mật khẩu</div>
                </div>
                <div class="card-body">
                  <form id="passwordForm" class="space-y-4">
                    <div class="form-group">
                      <label class="form-label"
                        >Mật khẩu cũ <span class="text-danger">*</span></label
                      >
                      <div class="input-wrapper">
                        <i class="fas fa-lock input-icon"></i>
                        <input
                          type="password"
                          class="form-input with-icon"
                          id="oldPassword"
                          required
                        />
                      </div>
                    </div>
                    <div class="grid grid-cols-2">
                      <div class="form-group">
                        <label class="form-label"
                          >Mật khẩu mới <span class="text-danger">*</span></label
                        >
                        <div class="input-wrapper">
                          <i class="fas fa-key input-icon"></i>
                          <input
                            type="password"
                            class="form-input with-icon"
                            id="newPassword"
                            required
                            minlength="6"
                          />
                        </div>
                      </div>
                      <div class="form-group">
                        <label class="form-label"
                          >Xác nhận mật khẩu
                          <span class="text-danger">*</span></label
                        >
                        <div class="input-wrapper">
                          <i class="fas fa-shield-check input-icon"></i>
                          <input
                            type="password"
                            class="form-input with-icon"
                            id="confirmPassword"
                            required
                            minlength="6"
                          />
                        </div>
                      </div>
                    </div>
                    <button
                      type="submit"
                      class="btn btn-secondary"
                      id="btnChangePassword"
                    >
                      <i class="fas fa-key"></i> Đổi mật khẩu
                    </button>
                  </form>
                </div>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>
    <script src="../../assets/js/app.js"></script>
    <script>
      let currentUser = null;

      function renderAvatar() {
        const name = currentUser.name || currentUser.email;
        const initials = App.getInitials(name);
        const display = document.getElementById("avatarDisplay");
        if (currentUser.created_at) {
          const joinDate = new Date(currentUser.created_at).toLocaleDateString('vi-VN');
          document.getElementById("displayJoinDate").textContent = joinDate;
        }
        if (currentUser.avatar_url) {
          display.innerHTML = `<img src="${App.getAvatarUrl(currentUser.avatar_url)}" alt="Avatar">`;
        } else {
          display.innerHTML = `<div class="avatar-initials">${initials}</div>`;
        }
      }

      function updateCardDisplay() {
        document.getElementById("displayName").textContent = currentUser.name || 'Chưa cập nhật';
        document.getElementById("displayEmail").textContent = currentUser.email || '—';
        document.getElementById("displayPhone").textContent = currentUser.phone || '—';
      }

      document.addEventListener("DOMContentLoaded", async () => {
        // 1. Lấy thông tin cá nhân hiện tại
        try {
          const res = await App.api("/users/profile");
          if (res.data) {
            currentUser = res.data;
            document.getElementById("profileEmail").value = res.data.email || "";
            document.getElementById("profileName").value = res.data.name || "";
            document.getElementById("profilePhone").value = res.data.phone || "";
            renderAvatar();
            updateCardDisplay();
          }
        } catch (error) {
          console.error("Không thể lấy thông tin cá nhân", error);
        }

        // 2. Xử lý Upload Avatar
        document.getElementById("avatarInput").addEventListener("change", async (e) => {
          const file = e.target.files[0];
          if (!file) return;
          
          if (file.size > 5 * 1024 * 1024) {
            return App.showToast("Dung lượng ảnh tối đa là 5MB", "warning");
          }

          const formData = new FormData();
          formData.append("avatar", file);

          App.showLoader();
          try {
            const res = await App.api("/users/avatar", "PUT", formData, true);
            App.showToast(res.message || "Đã cập nhật ảnh đại diện");
            
            // Update local state
            if (res.data && res.data.avatar_url) {
              currentUser.avatar_url = res.data.avatar_url;
              if (App.state.user) {
                App.state.user.avatar_url = res.data.avatar_url;
                localStorage.setItem("user", JSON.stringify(App.state.user));
                App.renderUserInfo();
              }
              renderAvatar();
            }
          } catch (error) {
            // Error handled by api method
          } finally {
            App.hideLoader();
          }
        });

        // 3. Xử lý form cập nhật thông tin
        document
          .getElementById("profileForm")
          .addEventListener("submit", async (e) => {
            e.preventDefault();
            const name = document.getElementById("profileName").value.trim();
            const phone = document.getElementById("profilePhone").value.trim();
            const btn = document.getElementById("btnUpdateProfile");
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Đang xử lý...';
            try {
              const res = await App.api("/users/profile", "PUT", {
                name,
                phone,
              });
              App.showToast(res.message || "Cập nhật thành công");
              
              currentUser.name = name;
              currentUser.phone = phone;
              updateCardDisplay();
              renderAvatar(); // in case initials changed

              // Cập nhật lại user trong localStorage và UI
              if (App.state.user) {
                App.state.user.name = name;
                localStorage.setItem("user", JSON.stringify(App.state.user));
                App.renderUserInfo();
              }
            } catch (error) {
              // Lỗi đã được xử lý
            } finally {
              btn.disabled = false;
              btn.innerHTML = '<i class="fas fa-save"></i> Lưu thay đổi';
            }
          });

        // 4. Xử lý form đổi mật khẩu
        document
          .getElementById("passwordForm")
          .addEventListener("submit", async (e) => {
            e.preventDefault();
            const oldPassword = document.getElementById("oldPassword").value;
            const newPassword = document.getElementById("newPassword").value;
            const confirmPassword = document.getElementById("confirmPassword").value;
            
            if (newPassword !== confirmPassword) {
              App.showToast("Xác nhận mật khẩu không khớp", "error");
              return;
            }
            
            const btn = document.getElementById("btnChangePassword");
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Đang xử lý...';
            try {
              const res = await App.api("/users/password", "PUT", {
                oldPassword,
                newPassword,
              });
              App.showToast(res.message || "Đổi mật khẩu thành công");
              document.getElementById("passwordForm").reset();
            } catch (error) {
            } finally {
              btn.disabled = false;
              btn.innerHTML = '<i class="fas fa-key"></i> Đổi mật khẩu';
            }
          });
      });
    </script>
  </body>
</html>
