<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thông báo - Người thuê</title>
    <link rel="stylesheet" href="../../assets/css/style.css" />
    <link rel="stylesheet" href="../../assets/css/responsive.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <body>
    <div class="app-container">
      <aside class="sidebar">
        <div class="sidebar-header">
          <div class="logo-icon"><i class="fas fa-house-chimney"></i></div>
          RoomRental
        </div>
        <nav class="sidebar-nav">
          <a href="../../index.html" class="nav-item"
            ><i class="fas fa-globe"></i> Trang chủ</a
          >
          <a href="dashboard.html" class="nav-item"
            ><i class="fas fa-home"></i> Tổng quan</a
          >
          <a href="requests.html" class="nav-item"
            ><i class="fas fa-paper-plane"></i> Yêu cầu thuê</a
          >
          <a href="contracts.html" class="nav-item"
            ><i class="fas fa-file-contract"></i> Hợp đồng</a
          >
          <a href="payments.html" class="nav-item"
            ><i class="fas fa-wallet"></i> Thanh toán</a
          >
          <div class="nav-section-label">Roommate</div>
          <a href="roommate-profile.html" class="nav-item"
            ><i class="fas fa-id-card"></i> Hồ sơ ghép & Lời mời</a
          >
          <div class="nav-section-label">Khác</div>
          <a href="profile.html" class="nav-item"
            ><i class="fas fa-user-edit"></i> Hồ sơ cá nhân</a
          >
          <a href="notifications.html" class="nav-item active"
            ><i class="fas fa-bell"></i> Thông báo</a
          >
          <a href="support.html" class="nav-item"
            ><i class="fas fa-headset"></i> Hỗ trợ</a
          >
        </nav>
        <div class="sidebar-footer">
          <a href="#" id="logoutBtn" class="nav-item"
            ><i class="fas fa-sign-out-alt"></i> Đăng xuất</a
          >
        </div>
      </aside>
      <main class="main-content">
        <header class="topbar">
          <div class="topbar-left">
            <button id="mobileMenuBtn" class="mobile-menu-btn">
              <i class="fas fa-bars"></i>
            </button>
            <h2 class="page-title">Thông báo</h2>
          </div>
          <div class="topbar-right">
            <button class="btn btn-ghost btn-sm" onclick="markAllRead()">
              <i class="fas fa-check-double"></i> Đọc tất cả
            </button>
            <div id="userDisplay"></div>
          </div>
        </header>
        <div class="page-content">
          <div class="card">
            <div class="card-body" id="notifList" style="padding: 0">
              <div class="text-center text-muted" style="padding: 3rem">
                <div class="spinner" style="margin: 0 auto 1rem"></div>
                Đang tải...
              </div>
            </div>
            <div id="pagination"></div>
          </div>
        </div>
      </main>
    </div>
    <script src="../../assets/js/app.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => loadNotifications());

      async function loadNotifications(page = 1) {
        try {
          const res = await App.api(`/notifications?page=${page}&limit=20`);
          const items = res.data || [];
          if (items.length === 0) {
            document.getElementById("notifList").innerHTML = App.emptyState(
              "bell-slash",
              "Chưa có thông báo",
              "Thông báo mới sẽ hiển thị tại đây",
            );
            return;
          }
          const typeIcons = {
            rental: "paper-plane",
            contract: "file-contract",
            payment: "wallet",
            roommate: "user-friends",
            support: "headset",
            system: "cog",
          };
          const typeColors = {
            rental: "blue",
            contract: "green",
            payment: "yellow",
            roommate: "purple",
            support: "cyan",
            system: "red",
          };
          document.getElementById("notifList").innerHTML = items
            .map(
              (n) => `
          <div style="display:flex;gap:1rem;padding:1rem 1.5rem;border-bottom:1px solid var(--border);${!n.is_read ? "background:var(--primary-light);" : ""} cursor:pointer;transition:var(--transition);" onclick="handleNotificationClick(${n.id}, '${n.reference_type || ""}', '${n.reference_id || ""}')" onmouseover="this.style.background='var(--surface-2)'" onmouseout="this.style.background='${!n.is_read ? "var(--primary-light)" : ""}'">
            <div class="stat-icon ${typeColors[(n.type || "SYSTEM").toLowerCase()] || "blue"}" style="width:40px;height:40px;font-size:0.875rem;flex-shrink:0;"><i class="fas fa-${typeIcons[(n.type || "SYSTEM").toLowerCase()] || "bell"}"></i></div>
            <div style="flex:1;min-width:0;">
              <div style="font-weight:${n.is_read ? "500" : "700"};font-size:0.875rem;margin-bottom:0.25rem;">${n.title || n.message || "Thông báo mới"}</div>
              <div style="font-size:0.8rem;color:var(--text-muted);">${n.message || n.content || "Bạn có thông báo mới"}</div>
              <div style="font-size:0.7rem;color:var(--text-light);margin-top:0.375rem;">${App.timeAgo(n.created_at)}</div>
            </div>
            ${!n.is_read ? '<div style="width:8px;height:8px;background:var(--primary);border-radius:50%;flex-shrink:0;margin-top:0.375rem;"></div>' : ""}
          </div>
        `,
            )
            .join("");
          const p = res.pagination;
          if (p)
            document.getElementById("pagination").innerHTML =
              App.renderPagination(
                p.page,
                p.limit,
                p.total,
                "loadNotifications",
              );
        } catch (e) {
          document.getElementById("notifList").innerHTML = App.emptyState(
            "exclamation-triangle",
            "Lỗi",
            "Không thể tải thông báo",
          );
        }
      }

      async function handleNotificationClick(id, referenceType, referenceId) {
        try {
          await App.api(`/notifications/${id}/read`, "PUT");
        } catch (e) {}

        const target = getNotificationTarget(referenceType, referenceId);
        if (target) {
          window.location.href = target;
          return;
        }

        loadNotifications();
      }

      function getNotificationTarget(referenceType, referenceId) {
        const type = (referenceType || "").toUpperCase();
        const currentPath = window.location.pathname.toLowerCase();
        const isOwner = currentPath.includes("/owner/");
        const supportPage = "support.html";

        if (type === "SUPPORT" || type === "SUPPORT_REQUEST") {
          return `${supportPage}?ticketId=${referenceId || ""}`;
        }

        if (type === "RENTAL_REQUEST") {
          return "requests.html";
        }

        if (type === "CONTRACT") {
          return "contracts.html";
        }

        if (type === "PAYMENT") {
          return "payments.html";
        }

        if (type === "ROOMMATE_REQUEST") {
          return isOwner
            ? "../user/roommate-profile.html"
            : "roommate-profile.html";
        }

        return null;
      }

      async function markAllRead() {
        try {
          await App.api("/notifications/read-all", "PUT");
          App.showToast("Đã đánh dấu tất cả đã đọc");
          loadNotifications();
        } catch (e) {}
      }
    </script>
  </body>
</html>
