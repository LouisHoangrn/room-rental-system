<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tìm Người Ở Ghép - RoomRental</title>
    <meta
      name="description"
      content="Tìm người ở ghép phù hợp với lối sống và ngân sách của bạn"
    />
    <link rel="stylesheet" href="../../assets/css/style.css" />
    <link rel="stylesheet" href="../../assets/css/responsive.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <style>
      .navbar {
        font-family: "Outfit", sans-serif;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        padding: 1rem 4rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: rgba(15, 23, 42, 0.6);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        z-index: 1000;
        transition: all 0.3s ease;
      }
      .nav-brand {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        font-size: 1.5rem;
        font-weight: 800;
        color: #fff;
        text-decoration: none;
      }
      .nav-brand .icon {
        width: 40px;
        height: 40px;
        background: linear-gradient(135deg, #6366f1, #06b6d4, #a855f7);
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 0 20px rgba(99, 102, 241, 0.5);
      }
      .nav-links {
        display: flex;
        gap: 1.5rem;
        align-items: center;
      }
      .btn-glass {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: #fff;
        backdrop-filter: blur(8px);
        transition: all 0.3s;
        padding: 0.5rem 1rem;
        border-radius: 8px;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        font-weight: 500;
      }
      .btn-glass:hover {
        background: rgba(255, 255, 255, 0.1);
        border-color: rgba(255, 255, 255, 0.2);
        transform: translateY(-2px);
        color: #fff;
      }
      .btn-gradient {
        background: linear-gradient(135deg, #6366f1, #06b6d4, #a855f7);
        background-size: 200% auto;
        color: #fff;
        border: none;
        transition: all 0.3s;
        padding: 0.5rem 1.25rem;
        border-radius: 8px;
        text-decoration: none;
        font-weight: 600;
        display: inline-block;
      }
      .btn-gradient:hover {
        background-position: right center;
        box-shadow: 0 10px 20px rgba(99, 102, 241, 0.4);
        transform: translateY(-2px);
        color: #fff;
      }

      /* Hero Search for Roommates */
      .hero-search {
        background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
        padding: 3rem 2rem;
        text-align: center;
        position: relative;
        overflow: hidden;
        padding-top: 120px;
      }
      .hero-search::before {
        content: "";
        position: absolute;
        top: -50%;
        right: -10%;
        width: 500px;
        height: 500px;
        background: radial-gradient(
          circle,
          rgba(6, 182, 212, 0.2) 0%,
          transparent 70%
        );
      }
      .hero-search h1 {
        font-size: 2.5rem;
        font-weight: 800;
        color: #fff;
        margin-bottom: 0.5rem;
        position: relative;
        z-index: 1;
      }
      .hero-search p {
        color: rgba(255, 255, 255, 0.65);
        font-size: 1.1rem;
        margin-bottom: 2rem;
        position: relative;
        z-index: 1;
      }
      .filter-bar {
        max-width: 1000px;
        margin: 0 auto;
        background: var(--surface);
        border-radius: var(--radius-xl);
        padding: 1.5rem;
        box-shadow: var(--shadow-xl);
        position: relative;
        z-index: 2;
        display: grid;
        grid-template-columns: 1fr 1fr 1fr 1fr auto;
        gap: 1.25rem;
        align-items: end;
        border: 1px solid var(--border);
      }
      .filter-bar .form-group {
        margin-bottom: 0;
      }
      .filter-bar .form-label {
        font-size: 0.8rem;
        margin-bottom: 0.4rem;
        color: var(--text-muted);
        font-weight: 500;
      }

      @media (max-width: 768px) {
        .filter-bar {
          grid-template-columns: 1fr 1fr;
        }
        .filter-bar button {
          grid-column: 1 / -1;
        }
      }

      /* Roommate Cards */
      .roommates-grid {
        max-width: 1280px;
        margin: 0 auto;
        padding: 2rem;
      }
      .roommates-results {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 1.5rem;
      }

      .roommate-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        padding: 1.5rem;
        transition: all 0.3s ease;
        display: flex;
        flex-direction: column;
        gap: 1rem;
        position: relative;
        overflow: hidden;
      }
      .roommate-card:hover {
        transform: translateY(-5px);
        box-shadow: var(--shadow-lg);
        border-color: rgba(99, 102, 241, 0.3);
      }
      .roommate-card::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 4px;
        background: linear-gradient(90deg, #6366f1, #06b6d4);
        opacity: 0;
        transition: opacity 0.3s ease;
      }
      .roommate-card:hover::before {
        opacity: 1;
      }

      .rm-header {
        display: flex;
        gap: 1rem;
        align-items: center;
        margin-bottom: 0.5rem;
      }
      .rm-avatar {
        width: 60px;
        height: 60px;
        flex-shrink: 0;
        border-radius: 50%;
        background: var(--surface-2);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.5rem;
        color: var(--primary);
        border: 2px solid rgba(99, 102, 241, 0.2);
      }
      .rm-avatar img {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        object-fit: cover;
      }
      .rm-info {
        flex: 1;
        min-width: 0;
      }
      .rm-info-inner {
        display: block;
      }
      .rm-info h3 {
        margin: 0;
        font-size: 1.15rem;
        font-weight: 700;
        color: var(--text-main);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        transition: all 0.3s ease;
      }
      .rm-info p {
        margin: 0.25rem 0 0;
        font-size: 0.85rem;
        color: var(--text-muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        transition: all 0.3s ease;
      }
      .roommate-card:hover .rm-info h3,
      .roommate-card:hover .rm-info p {
        white-space: normal;
      }

      .rm-match {
        position: absolute;
        top: 1.5rem;
        right: 1.5rem;
        background: rgba(16, 185, 129, 0.1);
        color: #10b981;
        padding: 0.2rem 0.5rem; /* Smaller padding */
        border-radius: 12px;
        font-size: 0.75rem; /* Smaller font */
        font-weight: 600;
        border: 1px solid rgba(16, 185, 129, 0.2);
      }

      .rm-details {
        background: var(--background);
        border-radius: var(--radius-md);
        padding: 1rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .rm-detail-item {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        font-size: 0.85rem;
        color: var(--text-muted);
        max-width: 48%;
      }
      .rm-detail-item i {
        color: var(--primary);
        width: 16px;
        text-align: center;
        flex-shrink: 0;
      }
      .rm-detail-item strong {
        color: var(--text-main);
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .rm-bio {
        font-size: 0.9rem;
        line-height: 1.5;
        color: var(--text-main);
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        height: 44px; /* Fixed height for 2 lines */
      }

      .rm-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
      }
      .rm-tag {
        background: var(--surface-2);
        color: var(--text-muted);
        padding: 0.25rem 0.75rem;
        border-radius: 20px;
        font-size: 0.75rem;
        font-weight: 500;
        border: 1px solid var(--border);
      }

      .rm-footer {
        margin-top: auto;
        padding-top: 1rem;
        border-top: 1px solid var(--border);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .rm-budget {
        font-size: 1.1rem;
        font-weight: 700;
        color: var(--danger);
      }
      .rm-budget span {
        font-size: 0.75rem;
        color: var(--text-muted);
        font-weight: 400;
      }
    </style>
  </head>

    <script>
      const MOCK_ROOMMATES = [
        {
          id: 1,
          name: "Nguyễn Minh Tuấn",
          age: 22,
          gender: "Nam",
          job: "Sinh viên IT",
          area: "Cầu Giấy, Hà Nội",
          budget: "2,500,000",
          bio: "Mình là sinh viên năm cuối, đi thực tập cả ngày. Tìm bạn cùng phòng ít đồ, giữ vệ sinh chung tốt. Mình có sẵn tủ lạnh và máy giặt.",
          match: "98%",
          tags: ["Không hút thuốc", "Sạch sẽ", "Ít nấu ăn"],
        },
        {
          id: 2,
          name: "Trần Thảo Vy",
          age: 24,
          gender: "Nữ",
          job: "Nhân viên văn phòng",
          area: "Đống Đa, Hà Nội",
          budget: "3,000,000",
          bio: "Đang thuê sẵn một căn chung cư mini 1 ngủ 1 khách ở Đống Đa. Cần tìm 1 bạn nữ ở ghép share tiền phòng. Giờ giấc tự do.",
          match: "92%",
          tags: ["Yêu động vật", "Thích nấu ăn", "Hướng ngoại"],
        },
        {
          id: 3,
          name: "Lê Hoàng Khánh",
          age: 21,
          gender: "Nam",
          job: "Sinh viên",
          area: "Thanh Xuân, Hà Nội",
          budget: "1,800,000",
          bio: "Mình cần tìm phòng ở ghép khu vực Thanh Xuân hoặc Hà Đông. Ưu tiên phòng có điều hòa. Mình sống khá khép kín và yên tĩnh.",
          match: "85%",
          tags: ["Yên tĩnh", "Không hút thuốc", "Dễ tính"],
        },
        {
          id: 4,
          name: "Phạm Ngọc Mai",
          age: 23,
          gender: "Nữ",
          job: "Designer",
          area: "Cầu Giấy, Hà Nội",
          budget: "4,000,000",
          bio: "Mình làm remote nên ở nhà phần lớn thời gian. Cần tìm bạn nữ ở ghép căn hộ 2 ngủ tại D'Capitale. Yêu cầu tôn trọng không gian riêng.",
          match: "78%",
          tags: ["Làm việc tại nhà", "Sạch sẽ", "Cú đêm"],
        },
      ];

      let sendToId = null;

      document.addEventListener("DOMContentLoaded", () => {
        App.renderPublicHeader("headerActions", false);
        if (App.isLoggedIn()) {
          loadSmartMatches();
        } else {
          renderRoommates(MOCK_ROOMMATES);
        }
      });

      async function loadSmartMatches(page = 1) {
        const grid = document.getElementById("roommatesGrid");
        grid.innerHTML =
          '<div style="grid-column: 1/-1; text-align: center; padding: 3rem;"><div class="spinner" style="margin:0 auto 1rem;"></div>Đang phân tích độ tương thích AI...</div>';

        try {
          const res = await App.api(`/roommates/matches?page=${page}&limit=9`);
          const items = res.data || [];

          if (items.length === 0) {
            grid.innerHTML = `<div style="grid-column:1/-1; text-align:center;">
            ${App.emptyState("user-friends", "Chưa có gợi ý", "Hãy cập nhật hồ sơ ở ghép trước để hệ thống tính toán phù hợp.", '<a href="../user/roommate-profile.html" class="btn btn-primary"><i class="fas fa-id-card"></i> Cập nhật hồ sơ</a>')}
          </div>`;
            document.getElementById("resultsCount").innerHTML =
              `Chưa có gợi ý phù hợp`;
            return;
          }

          document.getElementById("resultsCount").innerHTML =
            `Tìm thấy <strong style="color:var(--text-main);">${res.pagination?.total || items.length}</strong> gợi ý phù hợp cho bạn`;

          grid.innerHTML = items
            .map((m) => {
              const name = m.name || "Người dùng";
              const score = m.compatibility_score || 0;
              const scoreClass =
                score >= 70 ? "high" : score >= 40 ? "medium" : "low";
              const sleepMap = {
                EARLY: "Dậy sớm",
                LATE: "Thức khuya",
                FLEXIBLE: "Linh hoạt",
              };
              const workMap = {
                DAY: "Ca ngày",
                NIGHT: "Ca đêm",
                FLEXIBLE: "Linh hoạt",
              };

              // Default common icons mapping
              const iconMap = {
                "Sinh viên": "fa-graduation-cap",
                "Nhân viên VP": "fa-briefcase",
                "Sạch sẽ": "fa-broom",
                "Ít nói": "fa-comment-slash",
                "Có nuôi pet": "fa-paw",
                "Thích nấu ăn": "fa-utensils",
                "Thích thể thao": "fa-basketball",
                "Đọc sách": "fa-book",
                "Nghe nhạc": "fa-music",
                "Xem phim": "fa-film",
                "Hướng ngoại": "fa-users",
                "Hướng nội": "fa-user-ninja",
                "Thức khuya": "fa-moon",
                "Dậy sớm": "fa-sun",
                "Không hút thuốc": "fa-ban-smoking",
                "Thỉnh thoảng nhậu": "fa-beer-mug-empty",
                "Yêu động vật": "fa-cat",
                "Thích du lịch": "fa-plane",
                "Chơi game": "fa-gamepad",
                "Thích tiệc tùng": "fa-glass-cheers",
                "Ghét ồn ào": "fa-volume-xmark",
                "Ăn chay": "fa-leaf",
                "Sống tối giản": "fa-cube",
                "Công nghệ": "fa-laptop-code",
                "Nhiếp ảnh": "fa-camera",
                "Khách đến chơi": "fa-house-user",
                "Tập gym": "fa-dumbbell",
                "Nghệ thuật": "fa-palette",
                "Dễ tính": "fa-smile",
                "Sợ bẩn": "fa-pump-medical",
              };

              const tagsHtml = (m.tags || [])
                .map(
                  (t) =>
                    `<span class="rm-tag" style="background:var(--primary-light);color:var(--primary);"><i class="fas ${iconMap[t.name] || "fa-tag"}"></i> ${t.name}</span>`,
                )
                .join("");
              const commonTagsHtml =
                m.common_tags > 0
                  ? `<span class="rm-tag" style="background:var(--success-bg);color:var(--success-dark);border:1px solid var(--success);"><i class="fas fa-link"></i> ${m.common_tags} chung</span>`
                  : "";

              return `
            <div class="roommate-card" style="border-top: 4px solid ${score >= 70 ? "var(--success)" : score >= 40 ? "var(--warning)" : "var(--danger)"}">
              <div class="rm-match" style="background:${score >= 70 ? "var(--success-bg)" : score >= 40 ? "var(--warning-bg)" : "var(--danger-bg)"}; color:${score >= 70 ? "var(--success-dark)" : score >= 40 ? "var(--warning-dark)" : "var(--danger-dark)"}">
                <i class="fas fa-heart"></i> ${Math.round(score)}% Phù hợp
              </div>
              
              <div class="rm-header">
                <div class="rm-avatar" style="background: var(--surface-2); color: var(--text-main); font-weight: bold;">
                  ${App.getInitials(name)}
                </div>
                <div class="rm-info">
                  <div class="rm-info-inner">
                    <h3 style="margin:0; font-size:1.1rem;">${name}</h3>
                    <p style="margin:0; font-size:0.85rem; color:var(--text-muted);"><i class="fas fa-lock"></i> Đã ẩn liên hệ</p>
                  </div>
                </div>
              </div>

              <div class="rm-details" style="display:flex; flex-wrap:wrap; gap:0.5rem; background:var(--surface-2); padding:0.75rem; border-radius:var(--radius-md);">
                <div style="width:48%; font-size:0.8rem;"><i class="fas fa-moon text-primary w-4"></i> ${sleepMap[m.sleep_time] || "N/A"}</div>
                <div style="width:48%; font-size:0.8rem;"><i class="fas fa-briefcase text-primary w-4"></i> ${workMap[m.work_schedule] || "N/A"}</div>
                <div style="width:48%; font-size:0.8rem;"><i class="fas fa-broom text-primary w-4"></i> ${m.cleanliness || 3}/5 Sạch sẽ</div>
                ${m.is_smoking ? '<div style="width:48%; font-size:0.8rem;"><i class="fas fa-smoking text-primary w-4"></i> Hút thuốc</div>' : ""}
              </div>

              ${m.bio ? `<div class="rm-bio" style="font-style:italic;">"${m.bio}"</div>` : ""}

              <div class="rm-tags" style="margin-top:auto;">
                ${commonTagsHtml}
                ${tagsHtml}
              </div>

              <div class="rm-footer" style="margin-top:1rem;">
                <div class="rm-budget" style="flex:1;">
                  ${m.budget ? App.formatCurrency(m.budget) : "Thỏa thuận"} <span>/tháng</span>
                </div>
                <button class="btn btn-primary btn-sm" onclick="openSendModal(${m.user_id})">
                  <i class="fas fa-paper-plane"></i> Gửi yêu cầu
                </button>
              </div>
            </div>
          `;
            })
            .join("");
        } catch (e) {
          document.getElementById("resultsCount").innerHTML =
            `Chưa có gợi ý phù hợp`;
          grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; padding: 2rem;">
            ${App.emptyState("user-friends", "Hãy hoàn thiện hồ sơ", "Hệ thống cần bạn cập nhật hồ sơ cá nhân trước khi có thể tính toán gợi ý phù hợp.", '<a href="../user/roommate-profile.html" class="btn btn-primary"><i class="fas fa-id-card"></i> Cập nhật hồ sơ</a>')}
        </div>`;
        }
      }

      function renderRoommates(data) {
        document.getElementById("resultsCount").innerHTML =
          `Tìm thấy <strong style="color:var(--text-main);">${data.length}</strong> hồ sơ`;
        const grid = document.getElementById("roommatesGrid");

        grid.innerHTML = data
          .map(
            (rm) => `
        <div class="roommate-card">
          <div class="rm-match"><i class="fas fa-bolt"></i> ${rm.match} Phù hợp</div>
          
          <div class="rm-header">
            <div class="rm-avatar">
              <i class="fas ${rm.gender === "Nữ" ? "fa-female" : "fa-male"}"></i>
            </div>
            <div class="rm-info" title="${rm.name} | ${rm.gender} • ${rm.age} tuổi • ${rm.job}">
              <div class="rm-info-inner">
                <h3>${rm.name}</h3>
                <p>${rm.gender} • ${rm.age} tuổi • ${rm.job}</p>
              </div>
            </div>
          </div>

          <div class="rm-details">
            <div class="rm-detail-item">
              <i class="fas fa-map-marker-alt"></i>
              <strong>${rm.area}</strong>
            </div>
            <div class="rm-detail-item">
              <i class="fas fa-wallet"></i>
              <strong style="color: var(--danger)">~${rm.budget}đ</strong>
            </div>
          </div>

          <div class="rm-bio">"${rm.bio}"</div>

          <div class="rm-tags">
            ${rm.tags.map((t) => `<span class="rm-tag">${t}</span>`).join("")}
          </div>

          <div class="rm-footer">
            <button class="btn btn-primary btn-sm btn-block" style="width:100%;" onclick="App.checkAuth('Vui lòng đăng nhập để kết nối với người này!')">
              <i class="fas fa-paper-plane"></i> Kết nối
            </button>
          </div>
        </div>
      `,
          )
          .join("");
      }

      function searchRoommates() {
        if (App.isLoggedIn()) {
          loadSmartMatches();
        } else {
          const grid = document.getElementById("roommatesGrid");
          grid.innerHTML =
            '<div style="grid-column: 1/-1; text-align: center; padding: 3rem;"><div class="spinner" style="margin:0 auto 1rem;"></div>Đang phân tích...</div>';
          setTimeout(() => {
            const shuffled = [...MOCK_ROOMMATES].sort(
              () => 0.5 - Math.random(),
            );
            renderRoommates(shuffled.slice(0, 4));
          }, 800);
        }
      }

      // Modal Logic for Logged In users
      function openSendModal(userId) {
        if (!App.isLoggedIn()) {
          App.checkAuth("Vui lòng đăng nhập để gửi yêu cầu ghép đôi.");
          return;
        }
        sendToId = userId;
        document.getElementById("requestMsg").value = "";
        App.openModal("sendModal");
      }

      document
        .getElementById("sendRequestBtn")
        ?.addEventListener("click", async () => {
          if (!sendToId) return;
          try {
            await App.api("/roommates/requests", "POST", {
              receiver_id: sendToId,
              message: document.getElementById("requestMsg").value,
            });
            App.showToast("Đã gửi yêu cầu ghép đôi!", "success");
            App.closeModal("sendModal");
          } catch (e) {}
        });
    </script>
  </body>
</html>
