<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng ký - Hệ thống Thuê Phòng Trọ</title>
    <meta
      name="description"
      content="Đăng ký tài khoản thuê phòng trọ hoặc đăng phòng cho thuê"
    />
    <link rel="stylesheet" href="../../assets/css/style.css" />
    <link rel="stylesheet" href="../../assets/css/responsive.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <body>
    <div class="auth-wrapper">
      <!-- Left Banner -->
      <div class="auth-banner">
        <div class="auth-banner-content">
          <a
            href="../../index.html"
            class="auth-brand"
            style="text-decoration: none; color: inherit"
          >
            <div class="brand-icon"><i class="fas fa-house-chimney"></i></div>
            <span class="auth-brand-name">RoomRental</span>
          </a>
          <h1 class="auth-tagline">Bắt đầu<br /><span>hành trình mới</span></h1>
          <p class="auth-desc">
            Tạo tài khoản miễn phí để tìm phòng trọ, thuê phòng hoặc đăng phòng
            cho thuê.
          </p>
        </div>
        <div class="auth-features">
          <div class="auth-feature">
            <i class="fas fa-user-plus"></i
            ><span>Đăng ký miễn phí trong 30 giây</span>
          </div>
          <div class="auth-feature">
            <i class="fas fa-shield-alt"></i
            ><span>Bảo mật thông tin cá nhân</span>
          </div>
          <div class="auth-feature">
            <i class="fas fa-bolt"></i
            ><span>Bắt đầu tìm phòng ngay lập tức</span>
          </div>
        </div>
      </div>

      <!-- Right Form -->
      <div class="auth-form-side">
        <div class="auth-form-card">
          <div class="auth-form-header">
            <h2 class="auth-form-title">Tạo tài khoản</h2>
            <p class="auth-form-subtitle">Điền thông tin bên dưới để bắt đầu</p>
          </div>

          <form id="registerForm">
            <div class="form-group">
              <label class="form-label" for="name"
                >Họ tên <span class="required">*</span></label
              >
              <div class="form-control-icon">
                <i class="fas fa-user input-icon"></i>
                <input
                  type="text"
                  id="name"
                  class="form-control"
                  placeholder="Nguyễn Văn A"
                  required
                />
              </div>
            </div>

            <div class="form-group">
              <label class="form-label" for="email"
                >Email <span class="required">*</span></label
              >
              <div class="form-control-icon">
                <i class="fas fa-envelope input-icon"></i>
                <input
                  type="email"
                  id="email"
                  class="form-control"
                  placeholder="you@example.com"
                  required
                />
              </div>
            </div>

            <div class="form-group">
              <label class="form-label" for="phone">Số điện thoại</label>
              <div class="form-control-icon">
                <i class="fas fa-phone input-icon"></i>
                <input
                  type="tel"
                  id="phone"
                  class="form-control"
                  placeholder="0901234567"
                />
              </div>
            </div>

            <div class="form-row cols-2">
              <div class="form-group">
                <label class="form-label" for="password"
                  >Mật khẩu <span class="required">*</span></label
                >
                <input
                  type="password"
                  id="password"
                  class="form-control"
                  placeholder="Tối thiểu 6 ký tự"
                  required
                />
              </div>
              <div class="form-group">
                <label class="form-label" for="confirmPassword"
                  >Xác nhận <span class="required">*</span></label
                >
                <input
                  type="password"
                  id="confirmPassword"
                  class="form-control"
                  placeholder="Nhập lại mật khẩu"
                  required
                />
              </div>
            </div>

            <div class="form-group">
              <label class="form-label"
                >Bạn là <span class="required">*</span></label
              >
              <div class="toggle-group">
                <label class="toggle-btn active" id="roleUser">
                  <input
                    type="radio"
                    name="role"
                    value="USER"
                    checked
                    style="display: none"
                  />
                  <i class="fas fa-user"></i> Người thuê phòng
                </label>
                <label class="toggle-btn" id="roleOwner">
                  <input
                    type="radio"
                    name="role"
                    value="OWNER"
                    style="display: none"
                  />
                  <i class="fas fa-building"></i> Chủ trọ
                </label>
              </div>
            </div>

            <button
              type="submit"
              class="btn btn-primary btn-block btn-lg"
              style="margin-top: 0.5rem"
            >
              <i class="fas fa-user-plus"></i> Đăng ký
            </button>
          </form>

          <div
            style="
              text-align: center;
              margin-top: 2rem;
              font-size: 0.9rem;
              color: var(--text-muted);
            "
          >
            Đã có tài khoản?
            <a href="login.html" style="font-weight: 600">Đăng nhập</a>
          </div>
        </div>
      </div>
    </div>

    <script src="../../assets/js/app.js"></script>
    <script src="../../assets/js/auth.js"></script>
    <script>
      // Toggle role buttons
      document.querySelectorAll(".toggle-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          document
            .querySelectorAll(".toggle-btn")
            .forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
        });
      });
    </script>
  </body>
</html>
