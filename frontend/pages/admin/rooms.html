<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Duyệt phòng - Admin</title>
    <link rel="stylesheet" href="../../assets/css/style.css" />
    <link rel="stylesheet" href="../../assets/css/responsive.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <body>
    <div class="app-container">
      <aside class="sidebar">
        <div class="sidebar-header">
          <div class="logo-icon"><i class="fas fa-shield-alt"></i></div>
          Admin Panel
        </div>
        <nav class="sidebar-nav">
          <a href="dashboard.html" class="nav-item"
            ><i class="fas fa-chart-line"></i> Tổng quan</a
          >
          <a href="users.html" class="nav-item"
            ><i class="fas fa-users-cog"></i> Quản lý người dùng</a
          >
          <a href="rooms.html" class="nav-item active"
            ><i class="fas fa-building"></i> Duyệt phòng</a
          >
          <a href="notifications.html" class="nav-item"
            ><i class="fas fa-bell"></i> Thông báo</a
          >
          <a href="support.html" class="nav-item"
            ><i class="fas fa-life-ring"></i> Hỗ trợ</a
          >
        </nav>
        <div class="sidebar-footer">
          <a href="#" id="logoutBtn" class="nav-item"
            ><i class="fas fa-sign-out-alt"></i> Đăng xuất</a
          >
        </div>
      </aside>
      <main class="main-content">
        <header class="topbar">
          <div class="topbar-left">
            <button id="mobileMenuBtn" class="mobile-menu-btn">
              <i class="fas fa-bars"></i>
            </button>
            <h2 class="page-title">Duyệt phòng trọ</h2>
          </div>
          <div class="topbar-right"><div id="userDisplay"></div></div>
        </header>
        <div class="page-content">
          <!-- Filter Tabs — UPPERCASE status values -->
          <div class="tabs-header mb-4">
            <button class="tab-btn active" onclick="filterRooms('')">
              Tất cả
            </button>
            <button class="tab-btn" onclick="filterRooms('PENDING')">
              Chờ duyệt
            </button>
            <button class="tab-btn" onclick="filterRooms('AVAILABLE')">
              Đã duyệt
            </button>
            <button class="tab-btn" onclick="filterRooms('REJECTED')">
              Từ chối
            </button>
          </div>

          <div class="card">
            <div class="table-container">
              <table class="table">
                <thead>
                  <tr>
                    <th>Phòng</th>
                    <th>Chủ trọ</th>
                    <th>Giá</th>
                    <th>Quận/Huyện</th>
                    <th>Thành phố</th>
                    <th>Trạng thái</th>
                    <th>Hành động</th>
                  </tr>
                </thead>
                <tbody id="roomsBody"></tbody>
              </table>
            </div>
            <div id="pagination"></div>
          </div>
        </div>
      </main>
    </div>

    <!-- Room Detail Modal -->
    <div class="modal-overlay" id="roomModal">
      <div class="modal modal-lg">
        <div class="modal-header">
          <div>
            <div class="modal-title" id="modalRoomTitle"></div>
            <div class="modal-subtitle" id="modalRoomMeta"></div>
          </div>
          <button class="modal-close" onclick="App.closeModal('roomModal')">
            <i class="fas fa-times"></i>
          </button>
        </div>
        <div class="modal-body" id="modalRoomBody"></div>
        <div class="modal-footer" id="modalRoomActions"></div>
      </div>
    </div>

    <!-- Reject Reason Modal -->
    <div class="modal-overlay" id="rejectModal">
      <div class="modal">
        <div class="modal-header">
          <div class="modal-title">Lý do từ chối</div>
          <button class="modal-close" onclick="App.closeModal('rejectModal')">
            <i class="fas fa-times"></i>
          </button>
        </div>
        <div class="modal-body">
          <div class="form-group">
            <label class="form-label">Nhập lý do từ chối</label>
            <textarea
              id="rejectReason"
              class="form-control"
              rows="3"
              placeholder="VD: Ảnh minh họa không rõ ràng..."
            ></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button
            class="btn btn-secondary"
            onclick="App.closeModal('rejectModal')"
          >
            Hủy
          </button>
          <button class="btn btn-danger" onclick="confirmReject()">
            <i class="fas fa-times"></i> Từ chối
          </button>
        </div>
      </div>
    </div>

    <script src="../../assets/js/app.js"></script>
    <script>
      let currentStatus = "";
      let currentPage = 1;
      let rejectingRoomId = null;

      document.addEventListener("DOMContentLoaded", () => {
        loadRooms();
        const params = new URLSearchParams(window.location.search);
        const roomId = params.get("id");
        if (roomId) {
          setTimeout(() => viewRoom(roomId), 500);
        }
      });

      function filterRooms(status) {
        currentStatus = status;
        document
          .querySelectorAll(".tab-btn")
          .forEach((b) => b.classList.remove("active"));
        event.target.classList.add("active");
        loadRooms(1);
      }

      async function loadRooms(page = 1) {
        currentPage = page;
        const tbody = document.getElementById("roomsBody");
        tbody.innerHTML = App.tableLoading(7);
        try {
          let url = `/admin/rooms?page=${page}&limit=15`;
          if (currentStatus) url += `&status=${currentStatus}`;
          const res = await App.api(url);
          const items = res.data || [];
          if (items.length === 0) {
            tbody.innerHTML = App.tableEmpty(7, "Không có phòng nào");
            return;
          }
          tbody.innerHTML = items
            .map(
              (r) => `
          <tr>
            <td>
              <div class="flex items-center gap-3">
                <div style="width:48px;height:48px;border-radius:var(--radius-md);overflow:hidden;background:var(--surface-2);flex-shrink:0;">
                  ${r.primary_image ? `<img src="${App.getImageUrl(r.primary_image)}" style="width:100%;height:100%;object-fit:cover;">` : '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--text-light);"><i class="fas fa-image"></i></div>'}
                </div>
                <div class="font-semibold truncate" style="max-width:200px;">${r.title}</div>
              </div>
            </td>
            <td class="text-sm">${r.owner_name || "—"}</td>
            <td class="font-semibold">${App.formatCurrency(r.price)}</td>
            <td class="text-sm">${r.district || "—"}</td>
            <td class="text-sm">${r.city || "—"}</td>
            <td>${App.statusBadge(r.status)}</td>
            <td>
              <div style="display:flex; gap:0.5rem; align-items:center; flex-wrap:nowrap;">
                <button class="btn btn-ghost btn-sm" onclick="viewRoom(${r.id})" title="Chi tiết"><i class="fas fa-eye"></i></button>
                ${
                  r.status === "PENDING"
                    ? `
                  <button class="btn btn-success btn-sm" onclick="approveRoom(${r.id})" title="Duyệt"><i class="fas fa-check"></i></button>
                  <button class="btn btn-danger btn-sm" onclick="rejectRoom(${r.id})" title="Từ chối"><i class="fas fa-times"></i></button>
                `
                    : ""
                }
              </div>
            </td>
          </tr>
        `,
            )
            .join("");
          const p = res.pagination;
          if (p)
            document.getElementById("pagination").innerHTML =
              App.renderPagination(p.page, p.limit, p.total, "loadRooms");
        } catch (e) {
          tbody.innerHTML = App.tableEmpty(7, "Lỗi tải dữ liệu");
        }
      }

      async function viewRoom(id) {
        App.openModal("roomModal");
        try {
          const res = await App.api(`/rooms/${id}`);
          const r = res.data;
          const am = r.amenities || {};
          const amenityList = [];
          if (am.wifi) amenityList.push("WiFi");
          if (am.parking) amenityList.push("Bãi đỗ xe");
          if (am.air_conditioner) amenityList.push("Điều hòa");
          if (am.private_bathroom) amenityList.push("WC riêng");
          if (am.kitchen) amenityList.push("Bếp");

          document.getElementById("modalRoomTitle").textContent = r.title;
          document.getElementById("modalRoomMeta").innerHTML =
            `${App.statusBadge(r.status)} • ${r.district || ""}, ${r.city || ""} • ${App.formatCurrency(r.price)}/tháng`;
          document.getElementById("modalRoomBody").innerHTML = `
          ${
            r.images && r.images.length > 0
              ? `
            <div style="display:flex;gap:0.5rem;overflow-x:auto;margin-bottom:1.25rem;">
              ${r.images.map((img) => `<img src="${App.getImageUrl(img.image_url)}" style="height:120px;border-radius:var(--radius-md);flex-shrink:0;">`).join("")}
            </div>
          `
              : ""
          }
          <div class="info-list">
            <div class="info-item"><div class="info-item-icon"><i class="fas fa-user"></i></div><div class="info-item-content"><div class="info-item-label">Chủ trọ</div><div class="info-item-value">${r.owner_name || "—"} (${r.owner_email || ""})</div></div></div>
            <div class="info-item"><div class="info-item-icon"><i class="fas fa-expand-arrows-alt"></i></div><div class="info-item-content"><div class="info-item-label">Diện tích</div><div class="info-item-value">${r.area || "—"} m²</div></div></div>
            <div class="info-item"><div class="info-item-icon"><i class="fas fa-map-marker-alt"></i></div><div class="info-item-content"><div class="info-item-label">Địa chỉ</div><div class="info-item-value">${[r.street, r.district, r.city].filter(Boolean).join(", ") || "—"}</div></div></div>
          </div>
          ${r.description ? `<div style="margin-top:1rem;"><strong>Mô tả:</strong><div class="text-sm text-muted" style="margin-top:0.5rem;line-height:1.7;">${r.description}</div></div>` : ""}
          ${amenityList.length > 0 ? `<div style="margin-top:1rem;"><strong>Tiện ích:</strong><div style="display:flex;flex-wrap:wrap;gap:0.375rem;margin-top:0.5rem;">${amenityList.map((a) => `<span class="badge badge-primary">${a}</span>`).join("")}</div></div>` : ""}
          ${r.reject_reason ? `<div style="margin-top:1rem;padding:0.75rem;background:rgba(239,68,68,0.1);border-radius:var(--radius-md);"><strong style="color:var(--danger);">Lý do từ chối:</strong> ${r.reject_reason}</div>` : ""}
        `;
          document.getElementById("modalRoomActions").innerHTML =
            r.status === "PENDING"
              ? `<button class="btn btn-secondary" onclick="App.closeModal('roomModal')">Đóng</button>
             <button class="btn btn-danger" onclick="rejectRoom(${r.id});App.closeModal('roomModal')"><i class="fas fa-times"></i> Từ chối</button>
             <button class="btn btn-success" onclick="approveRoom(${r.id});App.closeModal('roomModal')"><i class="fas fa-check"></i> Duyệt phòng</button>`
              : `<button class="btn btn-secondary" onclick="App.closeModal('roomModal')">Đóng</button>`;
        } catch (e) {
          document.getElementById("modalRoomBody").innerHTML = "Lỗi";
        }
      }

      async function approveRoom(id) {
        if (!(await App.confirm("Duyệt phòng này?"))) return;
        try {
          await App.api(`/admin/rooms/${id}/approve`, "PUT");
          App.showToast("Đã duyệt phòng!", "success");
          loadRooms(currentPage);
        } catch (e) {}
      }

      function rejectRoom(id) {
        rejectingRoomId = id;
        document.getElementById("rejectReason").value = "";
        App.openModal("rejectModal");
      }

      async function confirmReject() {
        if (!rejectingRoomId) return;
        const reject_reason = document
          .getElementById("rejectReason")
          .value.trim();
        try {
          await App.api(`/admin/rooms/${rejectingRoomId}/reject`, "PUT", {
            reject_reason,
          });
          App.showToast("Đã từ chối phòng", "success");
          App.closeModal("rejectModal");
          loadRooms(currentPage);
        } catch (e) {}
      }
    </script>
  </body>
</html>
